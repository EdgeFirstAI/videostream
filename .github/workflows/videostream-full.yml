# Full tier for videostream, called by ci.yml (ci:full / ci:hardware) and
# nightly.yml.
#
# The shared rust-full.yml covers Rust-only workspaces. videostream is a C
# library with Rust and Python bindings, and its on-target lane runs the C,
# Python and Rust suites with gcov and llvm-cov coverage, the DMA-heap IPC
# test and camera capture. This workflow keeps that, with each architecture's
# C library compiled once:
#
#   plan            lanes, boards and the trusted-trigger guard
#   host            x86_64 and aarch64: coverage build, C/Python/Rust tests;
#                   aarch64 also stages instrumented binaries for the board
#   board           runs the staged binaries on each board label; never builds
#   board-coverage  merges the board's gcda/profraw on an aarch64 runner
#   sonar           one SonarCloud analysis over every lane's coverage
#
# Lanes: `all` runs everything; `hardware` runs only the aarch64 build and
# the boards.

name: videostream-full

on:
  workflow_call:
    inputs:
      lanes:
        description: "`all` (host and hardware) or `hardware`"
        type: string
        default: all
      boards:
        description: Comma-separated runner labels for the on-target lane
        type: string
        default: ""
      sonar:
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      host: ${{ steps.plan.outputs.host }}
      arches: ${{ steps.plan.outputs.arches }}
      boards: ${{ steps.plan.outputs.boards }}
      trusted: ${{ steps.plan.outputs.trusted }}
    steps:
      - id: plan
        env:
          LANES: ${{ inputs.lanes }}
          BOARDS: ${{ inputs.boards }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # Self-hosted runners only run for triggers that can be vouched for:
          # an explicit trusted set, so an event this list does not name
          # (pull_request_target, workflow_run, ...) is untrusted by default.
          trusted=false
          case "$EVENT_NAME" in
            push|workflow_dispatch|schedule|merge_group) trusted=true ;;
            pull_request) [[ "$HEAD_REPO" == "$REPO" ]] && trusted=true ;;
          esac

          host=false
          hardware=false
          case "$LANES" in
            all) host=true; hardware=true ;;
            hardware) hardware=true ;;
            *) echo "::error::lanes must be 'all' or 'hardware', got '$LANES'"; exit 1 ;;
          esac

          if [[ "$host" == true ]]; then
            arches='["x86_64","aarch64"]'
          else
            arches='["aarch64"]'
          fi

          boards='[]'
          if [[ "$hardware" == true && "$trusted" == true && -n "$BOARDS" ]]; then
            boards="$(jq -cn --arg b "$BOARDS" '$b | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')"
          elif [[ "$hardware" == true && "$trusted" != true ]]; then
            echo "::notice::on-target lane skipped: '$EVENT_NAME' from '$HEAD_REPO' is not a trusted trigger"
          fi

          {
            echo "host=$host"
            echo "arches=$arches"
            echo "boards=$boards"
            echo "trusted=$trusted"
          } >> "$GITHUB_OUTPUT"
          echo "host=$host arches=$arches boards=$boards trusted=$trusted"

  host:
    name: Build & Test (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.arches) }}
    env:
      # Only the x86_64 build feeds SonarCloud's C analysis.
      SONAR_WRAP: ${{ matrix.arch == 'x86_64' && inputs.sonar && needs.plan.outputs.trusted == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build-wrapper
        if: env.SONAR_WRAP == 'true'
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1

      - name: Build the C library with coverage
        env:
          # VPU and G2D are loaded with dlopen, so aarch64 builds them in and
          # a board without the hardware reports it at runtime.
          VSL_CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
            -DENABLE_COVER=ON
            -DENABLE_VPU=${{ matrix.arch == 'aarch64' && 'ON' || 'OFF' }}
            -DENABLE_G2D=${{ matrix.arch == 'aarch64' && 'ON' || 'OFF' }}
          VSL_BUILD_WRAPPER: ${{ env.SONAR_WRAP == 'true' && 'build-wrapper-linux-x86-64 --out-dir build/sonar' || '' }}
        run: bash .github/scripts/ci-setup.sh

      - name: Python tests with coverage
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pytest tests -v \
            --cov=videostream --cov-report=xml:build/coverage_python.xml \
            --junitxml=build/pytest_results.xml

      - uses: EdgeFirstAI/.github/.github/actions/setup-rust@6695677231afbfbdfc0aab22bc6a20a489ef3d0e  # main after EdgeFirstAI/.github#54, until tagged
        with:
          components: llvm-tools-preview
          tools: cargo-llvm-cov,cargo-nextest
          cache-key: full-${{ matrix.arch }}

      - name: Rust tests with coverage
        run: |
          cargo llvm-cov nextest --workspace --all-features --locked \
            --profile profiling \
            --lcov --output-path build/coverage_rust.lcov

      # nextest does not run doctests.
      - name: Rust doctests
        run: cargo test --doc --workspace --all-features --locked

      - name: Host/client IPC
        run: bash .github/scripts/ipc-test.sh build

      - name: Stage instrumented binaries for the board
        if: matrix.arch == 'aarch64' && needs.plan.outputs.boards != '[]'
        run: bash .github/scripts/stage-board-tests.sh

      # After every suite that loads libvideostream.so, so the .gcda counters
      # include the Python, Rust and IPC runs.
      - name: C coverage report
        run: gcovr -r . --sonarqube -o build/coverage_c_sonar.xml build/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ matrix.arch }}
          path: |
            build/coverage_c_sonar.xml
            build/coverage_python.xml
            build/coverage_rust.lcov
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: env.SONAR_WRAP == 'true'
        with:
          name: build-wrapper-output
          path: build/sonar
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: matrix.arch == 'aarch64' && needs.plan.outputs.boards != '[]'
        with:
          name: board-payload
          path: |
            build/libvideostream.so*
            build/src/vsl-*
            build/**/*.gcno
            target/tests/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: matrix.arch == 'aarch64' && needs.plan.outputs.boards != '[]'
        with:
          name: rust-llvm-cov-aarch64
          path: target/profiling/
          if-no-files-found: error
          retention-days: 1

      - name: Publish test results
        if: always() && needs.plan.outputs.trusted == 'true'
        uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b  # v2.18.0
        with:
          files: |
            build/pytest_results.xml
            target/nextest/profiling/test-results.xml
          check_name: Test Results (${{ matrix.arch }})
          comment_mode: off

  board:
    name: On-target (${{ matrix.board }})
    needs: [plan, host]
    if: needs.plan.outputs.boards != '[]'
    runs-on: ${{ matrix.board }}
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/build
      VIDEOSTREAM_LIBRARY: ${{ github.workspace }}/build/libvideostream.so
      VIDEOSTREAM_BIN: ${{ github.workspace }}/target/tests/videostream
      # The aarch64 build ran at /home/runner/work/videostream/videostream;
      # strip those five components so .gcda files land in this workspace.
      GCOV_PREFIX: ${{ github.workspace }}
      GCOV_PREFIX_STRIP: 5
    steps:
      # Runners on a board persist between jobs.
      - name: Reclaim the previous run
        run: |
          rm -rf build venv target board-coverage /tmp/videostream_* 2>/dev/null || true
          find . -name '*.gcda' -delete 2>/dev/null || true
          find . -name '*.profraw' -delete 2>/dev/null || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: board-payload

      # An artifact round trip does not preserve the executable bit.
      - name: Restore permissions
        run: |
          chmod +x build/src/vsl-* target/tests/*
          ls -la build/src/vsl-* target/tests/

      - name: Board environment
        run: |
          uname -a
          id
          ls -la /dev/dma_heap/ /dev/video* 2>&1 || true
          df -h . /tmp

      - name: Python tests with coverage
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pytest tests -v \
            --cov=videostream --cov-report=xml:build/coverage_python.xml \
            --junitxml=build/pytest_results.xml

      - name: Rust tests, including hardware tests
        run: bash .github/scripts/board-rust-tests.sh target/tests

      - name: Rust results as JUnit
        if: always()
        run: python3 .github/scripts/rust-junit.py build/rust-test-results build/rust_board_results.xml

      - name: Host/client IPC over the DMA heap
        run: bash .github/scripts/ipc-test.sh build

      - name: vsl-camhost capture
        run: bash .github/scripts/camhost-test.sh build

      - name: Collect coverage
        if: always()
        run: |
          mkdir -p board-coverage
          cp -r build/profraw board-coverage/ 2>/dev/null || true
          find build -name '*.gcda' -type f -exec cp --parents {} board-coverage/ \;
          cp build/coverage_python.xml board-coverage/ 2>/dev/null || true
          echo "gcda: $(find board-coverage -name '*.gcda' | wc -l)  profraw: $(find board-coverage -name '*.profraw' | wc -l)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: board-coverage-${{ matrix.board }}
          path: board-coverage/
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: board-results-${{ matrix.board }}
          path: |
            build/pytest_results.xml
            build/rust_board_results.xml
            build/rust-test-results/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/linux@170bf24d20d201b842d7a52403b73ed297e6645b  # v2.18.0
        with:
          files: |
            build/pytest_results.xml
            build/rust_board_results.xml
          check_name: Test Results (${{ matrix.board }})
          comment_mode: off

  board-coverage:
    name: Board coverage
    needs: [plan, host, board]
    if: needs.board.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: board-payload

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: rust-llvm-cov-aarch64
          path: target/profiling

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: board-coverage-*
          path: board-coverage
          merge-multiple: true

      - uses: EdgeFirstAI/.github/.github/actions/setup-rust@6695677231afbfbdfc0aab22bc6a20a489ef3d0e  # main after EdgeFirstAI/.github#54, until tagged
        with:
          components: llvm-tools-preview
          cache-key: board-coverage

      # gcov reads every source the build compiled, headers included; gcovr
      # fails the report when one is missing.
      - name: gcovr and the headers the build compiled against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcovr libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Merge board coverage
        run: |
          bash .github/scripts/merge-board-coverage.sh
          cp board-coverage/coverage_python.xml build/coverage_python_board.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-board
          path: |
            build/coverage_c_board_sonar.xml
            build/coverage_rust_board.lcov
            build/coverage_python_board.xml
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: SonarCloud
    needs: [plan, host, board-coverage]
    if: >-
      always() && inputs.sonar
      && needs.plan.outputs.host == 'true'
      && needs.plan.outputs.trusted == 'true'
      && needs.host.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.board-coverage.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # blame data

      # compile_commands.json names these headers; the C analysis resolves
      # them.
      - name: C analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-*
          path: coverage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-wrapper-output
          path: build/sonar

      - name: Coverage report paths
        run: |
          if [[ ! -f build/sonar/compile_commands.json ]]; then
            echo "::error::compile_commands.json missing from the build-wrapper output"
            exit 1
          fi
          find coverage -name 'coverage_python*.xml' -print0 |
            while IFS= read -r -d '' xml; do
              python3 scripts/fix_coverage_paths.py "$xml" videostream
            done
          join() { find coverage -name "$1" | sort | paste -sd, -; }
          {
            echo "PYTHON_COVERAGE_PATHS=$(join 'coverage_python*.xml')"
            echo "RUST_COVERAGE_PATHS=$(join 'coverage_rust*.lcov')"
            echo "C_COVERAGE_PATHS=$(join 'coverage_c*_sonar.xml')"
          } | tee -a "$GITHUB_ENV"

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=${{ env.PYTHON_COVERAGE_PATHS }}
            -Dsonar.rust.lcov.reportPaths=${{ env.RUST_COVERAGE_PATHS }}
            -Dsonar.coverageReportPaths=${{ env.C_COVERAGE_PATHS }}
            -Dsonar.cfamily.compile-commands=build/sonar/compile_commands.json
            -Dsonar.cfamily.analysisCache.mode=fs
            -Dsonar.cfamily.analysisCache.path=${{ runner.temp }}/cfamily-cache

      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage_summary.py --github-actions >> "$GITHUB_STEP_SUMMARY"
