# Tiered CI: Quick on every non-draft PR push, Full on the `ci:full` label
# (`ci:hardware` runs only the on-target lane and its aarch64 build), Nightly
# from nightly.yml. Branch protection requires `ci-gate` alone.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
# Shared workflows: EdgeFirstAI/.github, pinned by SHA in the uses: lines below.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      hardware:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.f.outputs.code }}
      full: ${{ steps.mode.outputs.full }}
      hardware: ${{ steps.mode.outputs.hardware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            code:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'include/**'
              - 'lib/**'
              - 'gst/**'
              - 'src/**'
              - 'crates/**'
              - 'videostream/**'
              - 'tests/**'
              - 'debian/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.config/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'NOTICE'
              - 'sonar-project.properties'
              - '.github/**'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_FULL: ${{ inputs.full }}
          DISPATCH_HARDWARE: ${{ inputs.hardware }}
        run: |
          full=false
          hardware=false
          case "$EVENT_NAME" in
            merge_group) full=true ;;
            workflow_dispatch)
              full="$DISPATCH_FULL"
              hardware="$DISPATCH_HARDWARE"
              ;;
          esac
          # Re-run Full on later pushes while the label is still present.
          case ",$LABELS," in *,ci:full,*) full=true ;; esac
          case ",$LABELS," in *,ci:hardware,*) hardware=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"

  # fmt, clippy (host and aarch64 check-only), nextest, workflow lint and the
  # dependency license policy. The Rust crates load libvideostream.so at
  # runtime, so the hook builds the C library first and exports its path.
  quick:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-quick.yml@6695677231afbfbdfc0aab22bc6a20a489ef3d0e  # main after EdgeFirstAI/.github#54, until tagged
    with:
      # ruff is not adopted yet: the package predates it and fails both
      # `ruff check` and `ruff format --check`.
      python: false
      pre-command: bash .github/scripts/ci-setup.sh
      clippy-args: --workspace --all-targets --all-features --locked -- -D warnings
      cross-clippy-args: --workspace --all-targets --all-features --locked -- -D warnings
      nextest-args: --workspace --all-features --locked
      timeout-minutes: 15
    permissions:
      contents: read

  # The C library's own checks, which rust-quick has no step for: the Python
  # bindings' tests and the host/client IPC round trip over POSIX shared
  # memory (hosted runners have no DMA heap).
  quick-c:
    name: Quick (C library, Python)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the C library
        run: bash .github/scripts/ci-setup.sh

      - name: Python tests
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt
          venv/bin/pytest tests -v

      - name: Host/client IPC
        run: bash .github/scripts/ipc-test.sh build

  full:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true'
    uses: ./.github/workflows/videostream-full.yml
    with:
      lanes: ${{ needs.changes.outputs.full == 'true' && 'all' || 'hardware' }}
      # Camera tests name the capture path they exercise, not a board.
      boards: camera-v4l2
    permissions:
      contents: read
      checks: write         # test result check runs
      pull-requests: write  # test result PR comment, SonarCloud decoration
    secrets: inherit

  sbom:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@6695677231afbfbdfc0aab22bc6a20a489ef3d0e  # main after EdgeFirstAI/.github#54, until tagged
    with:
      mode: full
      source-dirs: include lib gst src crates videostream tests
    permissions:
      contents: read

  ci-gate:
    if: always()
    needs: [changes, quick, quick-c, full, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
