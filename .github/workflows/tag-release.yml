# Release chain, step 2 of 3: a merged release/X.Y.Z PR becomes the annotated
# vX.Y.Z tag at the merge commit. See release.yml for the chain.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257  # v2.3.1
    with:
      # No tag unless release.yml is green for the release-branch head being
      # merged: the one place "the artifacts exist before the tag" is enforced.
      require-build: release.yml
    permissions:
      contents: write   # create the tag
      actions: read     # check the release.yml run
    secrets: inherit
