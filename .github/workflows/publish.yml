# Release chain, step 3 of 3: PUBLISH. Builds nothing.
#
# The shared workflow finds the release.yml run that built this tag, proves
# its tree is the tag's tree, downloads the artifacts, publishes the crates
# and creates the GitHub Release from the CHANGELOG section. The PyPI upload
# stays in this file because PyPI Trusted Publishing matches the publishing
# repository's own workflow.
#
# Before the first tag: re-point the crates.io and PyPI Trusted Publishers
# from release.yml to publish.yml, then rehearse with workflow_dispatch
# against a release branch with a green build. A rehearsal publishes nothing.

name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v2.6.0 (publishes nothing)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  # A half-finished publish cannot be recovered by cancelling it.
  cancel-in-progress: false

jobs:
  publish:
    uses: EdgeFirstAI/.github/.github/workflows/publish-rust.yml@903ae949fd40508b7b5cdaccbd3f7b7aa7df5f61  # main after EdgeFirstAI/.github#54, until tagged
    with:
      tag: ${{ inputs.tag }}
      build-workflow: release.yml
      publish-crates: true
      # Dependency order; must match release.yml.
      crate-packages: videostream-sys videostream videostream-cli
      release-files: |
        dist/*.zip
        dist/*.deb
        dist/*.pdf
        dist/*.whl
        dist/sbom.json
    permissions:
      contents: write   # create the GitHub Release
      actions: read     # read the release.yml run and its artifacts
      id-token: write   # crates.io trusted publishing
    secrets: inherit

  publish-pypi:
    needs: publish
    # Runs on a rehearsal too; only the upload step is gated.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/videostream/
    permissions:
      id-token: write
      contents: read
    steps:
      - id: stage
        uses: EdgeFirstAI/.github/.github/actions/stage-pypi@903ae949fd40508b7b5cdaccbd3f7b7aa7df5f61  # main after EdgeFirstAI/.github#54, until tagged
        with:
          distribution: videostream
          version: ${{ needs.publish.outputs.version }}

      # Directly in the job: the action resolves its container image from the
      # repository it is called from.
      - name: Upload to PyPI
        if: ${{ needs.publish.outputs.publish-registries == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: ${{ steps.stage.outputs.packages-dir }}
          skip-existing: true
