# Nightly: the Full tier on main, only when main moved since the last nightly
# that reached a verdict, plus the ungated advisory scan. The SonarCloud upload
# from this run is the main-branch baseline.

name: Nightly

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
    with:
      # `inputs` is null on a schedule trigger, so the fallback is required.
      force: ${{ inputs.force || false }}
    permissions:
      contents: read
      actions: read

  # Deliberately not `needs: changed`: cargo audit asks about the RustSec
  # database, which changes whether or not main does.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
    permissions:
      contents: read

  full:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/videostream-full.yml
    with:
      lanes: all
      boards: camera-v4l2
    permissions:
      contents: read
      checks: write
      pull-requests: write
    secrets: inherit

  sbom:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@2398c645a24aede06fecb4f02e97ef7fb7411780  # EdgeFirstAI/.github#54, until tagged
    with:
      mode: full
      source-dirs: include lib gst src crates videostream tests
    permissions:
      contents: read
