# Release chain, step 1 of 3: BUILD.
#
#   release.yml      push to release/*.*.*  -> build every artifact  (this file)
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# Every artifact the release ships is built here, on the release branch head,
# so a build failure is a red release PR rather than a failed tag. Artifacts
# are kept 30 days: publish.yml downloads them after the human-paced review
# and fails on an expired one rather than rebuilding.
#
# Distribution binaries build on ubuntu-22.04 images so the shipped library
# keeps a glibc 2.35 floor for older Yocto root filesystems.

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch name against Cargo.toml, pyproject.toml and the workspace's
  # internal dependency versions; the CHANGELOG section; `cargo package`.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
    with:
      # The shared release SBOM scans only src, tests and crates; the full
      # scan of the C sources is the sbom job below.
      sbom: false
      crate-packages: videostream-sys videostream videostream-cli
      # Three small crates; the free class packages them in about a minute.
      package-runner: ubuntu-24.04
    permissions:
      contents: read

  # The version surfaces release-rust.yml does not know about.
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: C header, Sphinx, NOTICE and generated bindings
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#release/}"
          version="${version%-rc*}"
          fail=0
          check() {
            if grep -qE "$2" "$1"; then
              echo "ok  $1"
            else
              echo "::error file=$1::$1 does not carry version $version"
              fail=1
            fi
          }
          v="${version//./\\.}"
          check include/videostream.h "^#define VSL_VERSION \"${v}\""
          check doc/conf.py "^version = '${v}'"
          check NOTICE "videostream-sys ${v}"
          check crates/videostream-sys/src/ffi.rs "b\"${v}\\\\0\""
          exit "$fail"

  sbom:
    uses: EdgeFirstAI/.github/.github/workflows/sbom.yml@19484eac4147ff0b31d38659621ff7baa6491127  # EdgeFirstAI/.github#54, until tagged
    with:
      mode: full
      source-dirs: include lib gst src crates videostream tests
      upload-name: sbom
      retention-days: "30"
    permissions:
      contents: read

  documentation:
    # mermaid-cli's headless Chrome needs the unprivileged user namespaces
    # that ubuntu-24.04's AppArmor profile blocks.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen graphviz \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-xetex latexmk tex-gyre
          python3 -m venv venv
          venv/bin/pip install -r doc/requirements.txt
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          sudo npm install -g @mermaid-js/mermaid-cli
          npx puppeteer browsers install chrome-headless-shell

      - name: Build PDF
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          make -C doc latexpdf
          mkdir -p dist
          cp doc/_build/latex/VideoStream.pdf "dist/videostream-${REF_NAME#release/}-documentation.pdf"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: documentation
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 30

  # ZIP archive: C library, tools, headers and the CLI.
  archive:
    name: Archive (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            cmake-flags: -DENABLE_VPU=OFF -DENABLE_G2D=OFF
          - arch: aarch64
            runner: ubuntu-22.04-arm
            # VPU and G2D are loaded with dlopen; no target libraries needed.
            cmake-flags: -DENABLE_VPU=ON -DENABLE_G2D=ON -DENABLE_HANTRO_CODEC=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the C library
        env:
          VSL_CMAKE_ARGS: >-
            -DCMAKE_INSTALL_PREFIX=/usr
            -DENABLE_COVER=OFF
            -DPORTABLE_ARCHIVE=ON
            ${{ matrix.cmake-flags }}
        run: bash .github/scripts/ci-setup.sh

      - uses: EdgeFirstAI/.github/.github/actions/setup-rust@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
        with:
          components: ""
          cache-key: release-${{ matrix.arch }}
          save-cache: "false"

      - name: Build the CLI
        run: |
          cargo build --release --locked -p videostream-cli
          install -D -m 0755 target/release/videostream build/usr/bin/videostream

      - name: Package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cpack --config build/CPackConfig.cmake -B build
          mkdir -p dist
          cp build/videostream-linux-${{ matrix.arch }}.zip \
            "dist/videostream-${REF_NAME#release/}-linux-${{ matrix.arch }}.zip"
          unzip -l dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  debian:
    name: Debian packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      DEB_CFLAGS_APPEND: -D_GLIBCXX_USE_CXX11_ABI=0
      DEB_BUILD_OPTIONS: nocheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts cmake pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3-dev

      - uses: EdgeFirstAI/.github/.github/actions/setup-rust@9f698bee471b68d231c39586af7b610f4080df09  # v2.0.0
        with:
          components: ""
          cache-key: release-deb-${{ matrix.arch }}
          save-cache: "false"

      - name: Build
        run: |
          python3 debian/gen-changelog.py
          dpkg-buildpackage --no-sign -b -j"$(nproc)"
          mkdir -p dist
          mv ../*.deb dist/
          for deb in dist/*.deb; do
            echo "--- $(basename "$deb")"
            dpkg -c "$deb"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: debian-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  # Pure-Python ctypes package; publish.yml uploads it to PyPI.
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wheel and sdist
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip build twine
          .venv/bin/python -m build --outdir dist
          .venv/bin/twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python
          path: dist/*
          if-no-files-found: error
          retention-days: 30
